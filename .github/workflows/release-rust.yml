name: Release Rust Windows
on:
  push:
    branches: [v2-rust]
    paths: ['Cargo.toml', 'Cargo.lock', 'src/**', '.github/workflows/release-rust.yml']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test
      - run: cargo build --release --locked
      - name: Publier la V2
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.0.0 target/release/overlay-tchat-twitch.exe --target "$env:GITHUB_SHA" --title "Overlay Twitch Chat 2.0.0" --notes "Version Windows x64 en Rust. Lancez overlay-tchat-twitch.exe et indiquez votre chaîne Twitch. Pour reprendre vos réglages V1, placez config.ini à côté de l’exécutable au premier lancement."
